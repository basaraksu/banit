<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banit | Sistem Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            background-color: #111; 
            border: 1px solid #333; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }
        .form-control { background-color: #000; color: #00ff00; border: 1px solid #333; }
        .form-control:focus { background-color: #000; color: #00ff00; border-color: #00ff00; box-shadow: none; }
        .btn-login { background-color: #00ff00; color: #000; font-weight: bold; }
        .btn-login:hover { background-color: #00cc00; color: #000; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <div class="card p-4">
            <h4 class="text-center mb-4">BANIT KONTROL MERKEZİ</h4>
            <div id="error-msg" class="alert alert-danger d-none" style="font-size: 0.9em; padding: 10px;"></div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Yetkili Kimliği</label>
                    <input type="text" id="username" class="form-control" autocomplete="off" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Erişim Şifresi</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-login w-100">GÜVENLİ GİRİŞ</button>
            </form>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>

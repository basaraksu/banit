version: '3.8'

services:
  banit:
    build: .
    container_name: banit_core
    restart: unless-stopped
    
    # SİHİRLİ DOKUNUŞ 1: İzolasyonu Kır!
    # Konteyner, ana makinenin (host) ağıyla tam entegre çalışacak.
    # Böylece 2222 ve 8000 portları doğrudan sunucuya açılacak.
    network_mode: "host"
    
    # SİHİRLİ DOKUNUŞ 2: Çekirdek Yetkisi (NET_ADMIN)
    # Bu yetki olmazsa Banit, iptables ile BANIT_JAIL'i kuramaz.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      
    # KALICI HAFIZA (Volumes)
    # Konteyner çökse, silinse veya güncellense bile veritabanındaki (banlananlar vs.) 
    # bilgilerin kaybolmaması için klasörü ana sunucuya zımbalıyoruz.
    volumes:
      - ./database:/banit_app/database